[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emochi-api"
version = "1.0.0"
description = "Unofficial Python API Client for Emochi / FlowGPT AI Character Chat"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "xellox", email = "truong77kk@gmail.com" }
]
dependencies = [
    "requests>=2.31.0",
    "websocket-client>=1.8.0",
    "deep-translator>=1.11.4"
]

[project.urls]
Homepage = "https://github.com/Keksskks/emochi-api"
Repository = "https://github.com/Keksskks/emochi-api.git"
Issues = "https://github.com/Keksskks/emochi-api/issues"
